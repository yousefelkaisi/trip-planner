@if (wizardOpen()) {
  <app-trip-wizard (done)="showWizard(false)" />
} @else {
  <div class="flex flex-col lg:h-dvh">
    <app-trip-header (newTrip)="showWizard(true)" />

    @if (store.error(); as error) {
      <div role="alert" class="flex items-center gap-3 bg-red-50 px-4 py-2 text-sm text-red-800">
        {{ error }}
        <button type="button" class="ml-auto underline" (click)="store.error.set(null)">
          Dismiss
        </button>
      </div>
    }

    <main
      cdkDropListGroup
      class="grid items-start gap-4 p-4 lg:min-h-0 lg:flex-1 lg:grid-cols-[20rem_minmax(0,1fr)_minmax(0,1fr)] lg:grid-rows-[minmax(0,1fr)] lg:items-stretch"
    >
      <app-place-browser
        class="order-3 lg:order-1"
        [day]="selectedDay()"
        (details)="detailId.set($event)"
      />

      <section class="order-1 flex flex-col gap-3 lg:order-2 lg:min-h-0">
        <div role="group" aria-label="Days" class="flex gap-1 rounded-lg bg-stone-200 p-1">
          @for (d of store.days(); track $index) {
            <button
              type="button"
              class="flex-1 rounded-md px-3 py-1.5 text-sm text-stone-600 aria-pressed:bg-white aria-pressed:font-medium aria-pressed:text-stone-900 aria-pressed:shadow-sm"
              [attr.aria-pressed]="!overview() && $index === selectedDay()"
              (click)="selectedDay.set($index); overview.set(false)"
            >
              Day {{ $index + 1 }} · {{ hubs[d.hub].name }}
            </button>
          }
          <button
            type="button"
            class="rounded-md px-3 py-1.5 text-sm text-stone-600 aria-pressed:bg-white aria-pressed:font-medium aria-pressed:text-stone-900 aria-pressed:shadow-sm"
            [attr.aria-pressed]="overview()"
            (click)="overview.set(true)"
          >
            Overview
          </button>
        </div>

        @if (overview()) {
          <app-trip-overview
            class="lg:min-h-0 lg:flex-1"
            [days]="store.days()"
            (details)="detailId.set($event)"
          />
        } @else {
          <app-day-column
            class="lg:min-h-0 lg:flex-1"
            [index]="selectedDay()"
            [day]="store.days()[selectedDay()]"
            (details)="detailId.set($event)"
          />
        }
      </section>

      <app-trip-map
        class="order-2 block h-80 lg:order-3 lg:h-full"
        [days]="store.days()"
        [day]="overview() ? null : selectedDay()"
      />
    </main>
  </div>

  @if (detail(); as d) {
    <app-place-detail [place]="d.place" [date]="d.date" (closed)="detailId.set(null)" />
  }
}
